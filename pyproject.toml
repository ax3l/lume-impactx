[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-impactx"
dynamic = ["version"]
description = "ImpactX-specific implementation of LUMEModel classes for virtual accelerators"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Lawrence Berkeley National Laboratory"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "lume-base>=0.5.0",
    "openpmd-beamphysics>=0.15.1",
    "numpy",
    # ImpactX's own Python API needs pandas for ImpactXParticleContainer.to_df() and
    # beam_moments_history(), both of which this package calls on every track. Neither
    # the conda-forge package nor the impactx-noacc wheel declares it, so we must.
    "pandas",
    "matplotlib",
    "pydantic",
    "h5py",
]

[project.urls]
Homepage = "https://github.com/lume-science/lume-impactx"
Repository = "https://github.com/lume-science/lume-impactx"
Documentation = "https://github.com/lume-science/lume-impactx"

[project.optional-dependencies]
# ImpactX itself is not a hard dependency: the accelerated builds (OpenMP, MPI, GPU)
# come from conda-forge as `impactx`, see [tool.pixi.dependencies] below. This extra
# pulls the sequential-CPU PyPI wheel, which is what CI and a quick `pip` start use.
impactx = [
    "impactx-noacc",
    # The conda-forge impactx package pulls openpmd-api in; the PyPI wheel does not,
    # and read_beam_monitor() needs it to read BeamMonitor output.
    "openpmd-api",
]
dev = [
    "pytest",
    "ipykernel",
    "pre-commit",
]
docs = [
    "pygments",
    "mkdocs",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-material",
    "livereload",
    "pytkdocs[numpy-style]",
]
all = [
    "lume-impactx[impactx,dev,docs]",
]

[tool.setuptools.packages.find]
include = ["lume_impactx*"]
namespaces = false

[tool.setuptools_scm]
version_file = "lume_impactx/_version.py"
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["lume_impactx/tests"]
markers = [
    "slow: tests that run a real ImpactX simulation",
]

[tool.ruff]
# select = []
# ignore = []

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
impactx = "*"
